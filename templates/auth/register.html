{{define "content"}}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">📝</div>
            <h2>Daftar Akun Baru</h2>
            <p>Registrasi pengguna baru untuk sistem Kedai Kopi Seduh</p>
        </div>

        {{if .Error}}
            <div class="alert-error">
                <span>⚠️</span> {{.Error}}
            </div>
        {{end}}

        <form method="post" action="/register" class="auth-form">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" value="{{.Nama}}" class="form-control" placeholder="Nama lengkap Anda" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" name="email" value="{{.Email}}" class="form-control" placeholder="contoh: user@seduhkopi.com" required>
            </div>

            <div class="form-group">
                <label for="role">Peran Pengguna (Role)</label>
                <select id="role" name="role" class="form-control" required>
                    <option value="ADMIN" {{if eq .Role "ADMIN"}}selected{{end}}>👑 Admin / Pemilik (Kelola master data, promo, laporan)</option>
                    <option value="KASIR" {{if eq .Role "KASIR"}}selected{{end}}>☕ Kasir (Transaksi penjualan, diskon, batal)</option>
                    <option value="MEMBER" {{if eq .Role "MEMBER"}}selected{{end}}>👤 Member / Pelanggan (Cek poin, riwayat belanja)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password (minimal 8 karakter)</label>
                <input type="password" id="password" name="password" minlength="8" class="form-control" placeholder="Minimal 8 karakter" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block">Daftar Akun</button>
                <div class="auth-alt">
                    Sudah punya akun? <a href="/login">Masuk di sini</a>
                </div>
            </div>
        </form>
    </div>
</div>
{{end}}
