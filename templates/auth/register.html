{{define "content"}}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Daftar Akun Member</h2>
            <p>Daftarkan akun pelanggan untuk menikmati program loyalitas & reward SeduhPoin</p>
        </div>

        {{if .Error}}
            <div class="alert-error">
                {{.Error}}
            </div>
        {{end}}

        <form method="post" action="/register" class="auth-form">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" value="{{.Nama}}" class="form-control" placeholder="Nama lengkap Anda" required autofocus>
            </div>

            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" name="email" value="{{.Email}}" class="form-control" placeholder="contoh: nama@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password (minimal 8 karakter)</label>
                <input type="password" id="password" name="password" minlength="8" class="form-control" placeholder="Minimal 8 karakter" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block">Daftar Akun Member</button>
                <div class="auth-alt">
                    Sudah punya akun? <a href="/login">Masuk di sini</a>
                </div>
            </div>
        </form>
    </div>
</div>
{{end}}
