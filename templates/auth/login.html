{{define "content"}}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">☕</div>
            <h2>Masuk ke SeduhPoin</h2>
            <p>Sistem Poin Member dan Promo Kedai Kopi Seduh</p>
        </div>

        {{if .Error}}
            <div class="alert-error">
                <span>⚠️</span> {{.Error}}
            </div>
        {{end}}

        <form method="post" action="/login" class="auth-form">
            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" name="email" value="{{.Email}}" class="form-control" placeholder="Masukkan alamat email Anda" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password Anda" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block">Masuk ke Sistem</button>
                <div class="auth-alt">
                    Belum memiliki akun? <a href="/register">Registrasi di sini</a>
                </div>
            </div>
        </form>
    </div>
</div>
{{end}}
