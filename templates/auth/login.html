{{define "content"}}
<div class="auth-container" style="max-width: 480px; margin: 40px auto;">
    <div class="auth-card" style="border-radius: 24px; padding: 40px 36px; box-shadow: 0 20px 50px rgba(45,33,29,0.07); border: 1px solid rgba(235,223,212,0.85); background: #ffffff;">
        
        <!-- Header -->
        <div class="auth-header" style="text-align: center; margin-bottom: 28px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #fbf3ea, #f5e3d1); margin-bottom: 14px; border: 1px solid #ebd7c3;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6b4c37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                    <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                    <line x1="6" y1="1" x2="6" y2="4"></line>
                    <line x1="10" y1="1" x2="10" y2="4"></line>
                    <line x1="14" y1="1" x2="14" y2="4"></line>
                </svg>
            </div>
            <h2 style="font-size: 26px; font-weight: 800; color: var(--espresso); margin: 0 0 8px; letter-spacing: -0.5px;">Masuk ke SeduhPoin</h2>
            <p style="font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.5;">
                Silakan masuk menggunakan akun terdaftar Anda untuk mengakses sistem Kedai Kopi Seduh.
            </p>
        </div>

        {{if .Error}}
            <div class="alert-error" style="display: flex; align-items: center; gap: 10px; background: #fdf2f0; color: #c0392b; border: 1px solid #f9d5d1; padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; margin-bottom: 20px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{.Error}}</span>
            </div>
        {{end}}

        <!-- Form Login -->
        <form method="post" action="/login" class="auth-form" style="margin: 0;">
            <!-- Email Field -->
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="email" style="display: block; font-size: 13px; font-weight: 700; color: var(--espresso); margin-bottom: 8px;">
                    Alamat Email
                </label>
                <div style="position: relative;">
                    <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #a89f91; display: flex; align-items: center; pointer-events: none;">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                        </svg>
                    </span>
                    <input type="email" id="email" name="email" value="{{.Email}}" class="form-control" 
                           placeholder="nama@email.com" 
                           style="width: 100%; padding: 12px 14px 12px 42px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 14px; transition: all 0.2s; box-sizing: border-box;"
                           required autofocus>
                </div>
                <small style="display: block; margin-top: 5px; color: var(--muted); font-size: 11.5px;">
                    Masukkan alamat email akun yang telah didaftarkan.
                </small>
            </div>

            <!-- Password Field with Show/Hide Eye Toggle -->
            <div class="form-group" style="margin-bottom: 24px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label for="password" style="font-size: 13px; font-weight: 700; color: var(--espresso); margin: 0;">
                        Kata Sandi
                    </label>
                </div>
                <div style="position: relative;">
                    <span style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #a89f91; display: flex; align-items: center; pointer-events: none;">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password" class="form-control" 
                           placeholder="Minimal 8 karakter kata sandi" 
                           style="width: 100%; padding: 12px 46px 12px 42px; border-radius: 12px; border: 1.5px solid var(--line); font-size: 14px; transition: all 0.2s; box-sizing: border-box;" 
                           required>
                    <!-- Eye Toggle Button -->
                    <button type="button" id="togglePasswordBtn" 
                            style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 6px; cursor: pointer; color: #8c827a; display: flex; align-items: center; justify-content: center; border-radius: 6px;"
                            title="Tampilkan / Sembunyikan Kata Sandi">
                        <!-- Eye Icon (Open) -->
                        <svg id="eyeIconOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- Eye Icon (Closed) -->
                        <svg id="eyeIconClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
                            <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
                            <line x1="2" y1="2" x2="22" y2="22"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="form-actions" style="margin-bottom: 8px;">
                <button type="submit" class="btn btn-primary btn-block" 
                        style="width: 100%; padding: 13px; font-size: 14.5px; font-weight: 700; border-radius: 12px; letter-spacing: 0.3px; box-shadow: 0 4px 12px rgba(74,48,39,0.18);">
                    Masuk ke Sistem
                </button>
            </div>
        </form>

    </div>
</div>

<script>
    // Script Toggle Password (Lihat / Sembunyikan Kata Sandi)
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIconOpen = document.getElementById('eyeIconOpen');
    const eyeIconClosed = document.getElementById('eyeIconClosed');

    if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function() {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            if (isPassword) {
                passwordInput.setAttribute('type', 'text');
                eyeIconOpen.style.display = 'none';
                eyeIconClosed.style.display = 'block';
            } else {
                passwordInput.setAttribute('type', 'password');
                eyeIconOpen.style.display = 'block';
                eyeIconClosed.style.display = 'none';
            }
            passwordInput.focus();
        });
    }
</script>
{{end}}
