{{define "content"}}<div class="page-head clearfix"><h3 class="float-left">Data Member</h3></div><form class="form" method="post"><div class="form-group"><label>Nomor Member</label><input class="form-control" name="nomor" required></div><div class="form-group"><label>Nama</label><input class="form-control" name="nama" required></div><div class="form-group"><label>No. HP</label><input class="form-control" name="no_hp" required></div><div class="form-group"><label>Email</label><input class="form-control" type="email" name="email"></div><div class="form-group"><label>Alamat</label><input class="form-control" name="alamat"></div><button class="btn">Tambah Member</button></form><table class="table"><thead><tr><th>Nomor</th><th>Nama</th><th>HP</th><th>Tingkat</th><th>Total belanja 3 bulan</th></tr></thead><tbody>{{range .}}<tr><td>{{.Nomor}}</td><td>{{.Nama}}</td><td>{{.NoHP}}</td><td>{{.Tingkat}}</td><td>{{rupiah .Total}}</td></tr>{{end}}</tbody></table>{{end}}
