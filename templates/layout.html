{{define "layout"}}
<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SeduhPoin — Kedai Kopi Seduh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --espresso: #241611;
            --coffee: #543729;
            --caramel: #c4783c;
            --caramel-light: #fbeee3;
            --cream: #faf6f0;
            --card-bg: #ffffff;
            --muted: #7d6f67;
            --line: #ecdcd1;
            --green: #2d7a52;
            --green-bg: #eaf6ef;
            --gold: #b8860b;
            --gold-bg: #fdf5e6;
            --silver: #556270;
            --silver-bg: #f0f2f5;
            --red: #c0392b;
            --red-bg: #fdeeed;
            --shadow: 0 10px 30px rgba(53, 31, 20, 0.06);
            --shadow-hover: 0 14px 36px rgba(53, 31, 20, 0.12);
            --radius: 14px;
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--espresso);
            background: var(--cream);
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        /* Top Header */
        header {
            height: 72px;
            background: var(--espresso);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 36px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }
        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand-mark {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: linear-gradient(135deg, #d88949, #9e5924);
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(196,120,60,0.35);
        }
        .brand-text .brand-title {
            display: block;
            font: 700 22px 'Playfair Display', Georgia, serif;
            letter-spacing: -0.3px;
            color: #fff;
            line-height: 1.1;
        }
        .brand-text .brand-title span { color: #f3b079; }
        .brand-text small {
            display: block;
            color: #d1bfb3;
            font-size: 9px;
            letter-spacing: 1.6px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
        }
        .badge-role {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.12);
            color: #f7d8be;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.15);
        }

        /* Sidebar Navigation */
        aside {
            position: fixed;
            left: 0;
            top: 72px;
            bottom: 0;
            width: 260px;
            background: #ffffff;
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            z-index: 90;
        }
        .sidebar-top { padding: 24px 16px 12px; }
        .sidebar-bottom { padding: 16px; border-top: 1px solid var(--line); background: #fdfaf6; }

        .side-intro {
            padding: 4px 12px 18px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--line);
        }
        .side-intro .eyebrow {
            display: block;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: var(--caramel);
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .side-intro strong {
            display: block;
            font: 700 18px 'Playfair Display', Georgia, serif;
            color: var(--espresso);
            line-height: 1.2;
        }

        .nav-section-label {
            display: block;
            font-size: 10px;
            letter-spacing: 1.2px;
            color: var(--muted);
            font-weight: 800;
            text-transform: uppercase;
            padding: 14px 14px 6px;
        }

        aside ul { list-style: none; margin: 0; padding: 0; }
        aside li { margin: 4px 0; }
        aside li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 10px;
            color: #5d514a;
            font-size: 13.5px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        aside li a .nav-icon {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: #f7eee7;
            color: var(--coffee);
            font-size: 14px;
            transition: all 0.2s;
        }
        aside li a:hover {
            background: var(--caramel-light);
            color: var(--coffee);
            transform: translateX(3px);
        }
        aside li a:hover .nav-icon {
            background: var(--caramel);
            color: #fff;
        }
        aside li.disabled a {
            opacity: 0.6;
            cursor: default;
        }
        aside li.disabled a:hover {
            background: transparent;
            transform: none;
            color: #5d514a;
        }
        aside li.disabled a:hover .nav-icon {
            background: #f7eee7;
            color: var(--coffee);
        }

        .user-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px 12px;
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--coffee);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 14px;
        }
        .user-info { flex: 1; min-width: 0; }
        .user-name {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--espresso);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-role-label {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            color: var(--caramel);
            text-transform: uppercase;
        }

        /* Main Content Container */
        main {
            margin-left: 260px;
            padding: 40px 48px 80px;
            min-height: calc(100vh - 140px);
            max-width: 1440px;
        }

        /* Typography */
        h1, h2, h3, h4 { color: var(--espresso); font-family: 'Playfair Display', Georgia, serif; }
        h1 { font-size: 38px; line-height: 1.15; margin: 0 0 10px; }
        h2 { font-size: 26px; margin: 0 0 16px; }
        h3 { font-size: 21px; margin: 0 0 14px; }
        p { color: var(--muted); margin: 0 0 16px; line-height: 1.6; font-size: 14px; }

        /* Buttons & Forms */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 0;
            border-radius: 10px;
            padding: 10px 18px;
            background: var(--coffee);
            color: #fff;
            font-weight: 600;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn:hover {
            background: var(--espresso);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(53,31,20,0.18);
        }
        .btn-light {
            background: #fff;
            color: var(--coffee);
            border: 1px solid var(--line);
        }
        .btn-light:hover {
            background: #fbf6f0;
            border-color: var(--caramel);
            color: var(--espresso);
        }
        .btn-danger {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid #f6cfcc;
        }
        .btn-danger:hover {
            background: var(--red);
            color: #fff;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
        }
        .btn-block { width: 100%; }

        .form-control {
            width: 100%;
            border: 1px solid #dfd3c7;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
            color: var(--espresso);
            background: #ffffff;
            font-family: inherit;
            transition: all 0.2s;
        }
        .form-control:focus {
            outline: 0;
            border-color: var(--caramel);
            box-shadow: 0 0 0 3px rgba(196,120,60,0.16);
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--espresso);
            margin-bottom: 6px;
        }

        .form {
            max-width: 680px;
            background: var(--card-bg);
            border: 1px solid var(--line);
            padding: 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 32px;
        }

        /* Tables */
        .table {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            border-spacing: 0;
            overflow: hidden;
            box-shadow: var(--shadow);
            font-size: 13.5px;
        }
        .table th, .table td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }
        .table th {
            background: #faf4ed;
            color: #635248;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }
        .table tr:last-child td { border-bottom: 0; }
        .table tbody tr:hover { background: #fffbf7; }
        .table .num { text-align: right; }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .badge-gold { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .badge-silver { background: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
        .badge-aktif { background: var(--green-bg); color: var(--green); }

        /* Cards & Dashboard */
        .dashboard-hero {
            background: linear-gradient(135deg, #f7e6d4, #f4d0b0);
            border-radius: 20px;
            padding: 36px 42px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(196,120,60,0.25);
            margin-bottom: 32px;
        }
        .dashboard-hero:after {
            content: "";
            position: absolute;
            right: 120px;
            top: -60px;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            pointer-events: none;
        }
        .hero-text h1 { font-size: 34px; margin-bottom: 8px; }
        .hero-text p { font-size: 14.5px; color: #5a4235; max-width: 580px; margin-bottom: 0; }
        .hero-badge {
            display: inline-block;
            background: #fff;
            color: var(--coffee);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            position: relative;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: var(--caramel);
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 20px;
            margin-bottom: 14px;
        }
        .icon-brown { background: #fbeee3; color: var(--coffee); }
        .icon-blue { background: #e7f1f9; color: #21618c; }
        .icon-gold { background: #fdf5e6; color: #b8860b; }
        .icon-green { background: #eaf6ef; color: var(--green); }

        .stat-num {
            font-size: 26px;
            font-weight: 800;
            color: var(--espresso);
            line-height: 1;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }
        .stat-desc {
            font-size: 11.5px;
            color: #9c8e85;
            margin-top: 6px;
        }

        .actions { display: flex; gap: 8px; align-items: center; }

        /* Auth Screen (Centered) */
        .auth-container {
            max-width: 460px;
            margin: 30px auto;
        }
        .auth-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 16px 40px rgba(45,33,29,0.08);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        .auth-header h2 { font-size: 25px; margin: 0 0 6px; }
        .auth-header p { font-size: 13px; color: var(--muted); margin: 0; }
        .alert-error {
            background: var(--red-bg);
            color: var(--red);
            border: 1px solid #f6cfcc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .auth-alt {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: var(--muted);
        }
        .auth-alt a {
            color: var(--caramel);
            font-weight: 700;
        }
        .auth-alt a:hover { text-decoration: underline; }

        .demo-accounts {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed var(--line);
        }
        .demo-heading {
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--muted);
            margin-bottom: 10px;
            text-align: center;
        }
        .demo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .demo-btn {
            background: #faf4ed;
            border: 1px solid #ebdcd0;
            border-radius: 8px;
            padding: 8px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .demo-btn:hover {
            background: var(--caramel-light);
            border-color: var(--caramel);
        }
        .demo-btn strong {
            display: block;
            font-size: 11px;
            color: var(--espresso);
            margin-bottom: 2px;
        }
        .demo-btn small {
            display: block;
            font-size: 9px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Clean Auth Layout Fallback */
        body:has(.auth-container) aside { display: none; }
        body:has(.auth-container) main {
            margin-left: 0;
            padding: 40px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 140px);
        }
        body:has(.auth-container) footer { margin-left: 0; text-align: center; }

        /* Footer */
        footer {
            margin-left: 260px;
            padding: 22px 48px;
            border-top: 1px solid var(--line);
            background: #ffffff;
            color: var(--muted);
            font-size: 12.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        footer p { margin: 0; font-size: inherit; }

        @media (max-width: 960px) {
            aside { width: 220px; }
            main, footer { margin-left: 220px; padding: 28px 24px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 680px) {
            aside { position: static; width: 100%; border-right: 0; border-bottom: 1px solid var(--line); }
            main, footer { margin-left: 0; padding: 20px 16px; }
            .stats-grid { grid-template-columns: 1fr; }
            .dashboard-hero { flex-direction: column; text-align: center; padding: 24px; }
            .dashboard-hero:after { display: none; }
        }
    </style>
</head>
<body>
    <header>{{template "header" .}}</header>
    <aside>{{template "sidebar" .}}</aside>
    <main>{{template "content" .}}</main>
    <footer>{{template "footer" .}}</footer>
</body>
</html>
{{end}}
