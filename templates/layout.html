<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SeduhPoin — Kedai Kopi Seduh</title>
<style>
:root{--espresso:#2d211d;--coffee:#68483a;--caramel:#c88952;--cream:#fffaf3;--paper:#fff;--muted:#8b817b;--line:#eee5dc;--green:#5e806d;--shadow:0 16px 40px rgba(65,44,32,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--espresso);background:var(--cream)}a{color:inherit;text-decoration:none}header{height:78px;background:var(--espresso);color:#fff;display:flex;align-items:center;padding:0 42px;gap:13px}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--caramel);font-size:21px}.brand{display:block;font:700 22px Georgia,serif;letter-spacing:-.5px}.brand span{color:#e3a468}.brand+small{display:block;color:#c7b8ae;font-size:8px;letter-spacing:1.7px;margin-top:1px}aside{position:fixed;left:0;top:78px;bottom:0;width:245px;padding:38px 18px;background:#fff;border-right:1px solid var(--line)}.side-intro{padding:0 18px 20px}.eyebrow{font-size:10px;letter-spacing:1.7px;color:var(--caramel);font-weight:800;margin:0 0 7px}.side-intro strong{font:600 18px Georgia,serif}.side-intro .eyebrow{color:var(--muted);margin-bottom:5px}aside ul{list-style:none;margin:0;padding:0}aside li{margin:5px 0}aside li a{display:flex;align-items:center;gap:13px;padding:13px 17px;border-radius:12px;color:#786d67;font-size:14px;font-weight:600;transition:.2s}aside li a span{width:18px;text-align:center;font-size:17px;color:#b39a8b}aside li a:hover,aside li:first-child a{background:#fff5eb;color:var(--coffee)}aside li a:hover span,aside li:first-child a span{color:var(--caramel)}main{margin-left:245px;padding:48px 56px 70px;min-height:calc(100vh - 130px);max-width:1400px}h1,h2,h3{margin:0;color:var(--espresso)}h1{font:700 48px/1.07 Georgia,serif;letter-spacing:-1.8px}h1 em{color:var(--caramel);font-style:normal}h2{font:700 25px Georgia,serif}h3{font:700 23px Georgia,serif}p{color:var(--muted)}.welcome{min-height:275px;border-radius:24px;padding:40px 48px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(117deg,#f8e8d4,#f5d4b2);overflow:hidden;position:relative}.welcome:after{content:"";position:absolute;width:260px;height:260px;border:1px solid rgba(116,75,46,.16);border-radius:50%;right:94px;top:-87px}.lead{max-width:470px;line-height:1.7;margin:17px 0 0;font-size:15px}.coffee-art{font-size:130px;filter:drop-shadow(0 13px 7px rgba(78,45,25,.14));z-index:1;margin-right:65px}.section-head{display:flex;justify-content:space-between;align-items:end;margin:43px 0 17px}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.quick-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:17px;padding:21px;min-height:142px;box-shadow:var(--shadow);transition:transform .2s}.quick-card:hover{transform:translateY(-4px)}.quick-card strong,.quick-card small{display:block}.quick-card strong{margin-top:16px;font-size:15px}.quick-card small{color:var(--muted);font-size:12px;margin-top:5px}.quick-card b{position:absolute;right:20px;bottom:20px;color:var(--caramel);font-size:20px}.quick-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;font-size:20px}.brown{background:#f5e5d9}.orange{background:#fff0d9}.green{background:#e5f0e9}.blue{background:#e5edf2}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.page-head h3{margin:0}.form{max-width:650px;background:#fff;border:1px solid var(--line);padding:25px;border-radius:17px;box-shadow:var(--shadow);margin-bottom:30px}.form-group{margin-bottom:16px}.form-group label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.form-control{width:100%;border:1px solid #e3d9cf;border-radius:9px;padding:11px 12px;color:var(--espresso);font:inherit;background:#fff}.form-control:focus{outline:0;border-color:var(--caramel);box-shadow:0 0 0 3px rgba(200,137,82,.14)}.btn{display:inline-block;border:0;border-radius:9px;padding:10px 17px;background:var(--coffee);color:#fff;font-weight:700;cursor:pointer;font:inherit}.btn:hover{background:var(--espresso)}.btn-light{background:#fff;color:var(--coffee);border:1px solid var(--line)}.btn-danger{background:#fff1ee;color:#b35445;border:1px solid #f0d2cc}.btn-sm{padding:7px 10px;font-size:12px}.actions{display:flex;gap:6px;align-items:center}.actions form{margin:0}.table{width:100%;background:#fff;border:1px solid var(--line);border-radius:15px;border-spacing:0;overflow:hidden;box-shadow:var(--shadow);font-size:13px}.table th,.table td{padding:14px 15px;text-align:left;border-bottom:1px solid var(--line)}.table th{background:#fcf8f4;color:#746860;font-size:11px;letter-spacing:.4px;text-transform:uppercase}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#fffaf5}.table .num{text-align:right}.form-hint{font-size:12px;color:var(--muted)}footer{margin-left:245px;padding:20px 56px;border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px}footer p{margin:0}@media(max-width:900px){aside{width:190px}main,footer{margin-left:190px;padding-left:28px;padding-right:28px}.quick-grid{grid-template-columns:repeat(2,1fr)}.coffee-art{margin-right:0}.welcome{padding:32px}}@media(max-width:600px){header{padding:0 20px}header small{display:none}aside{position:static;width:100%;padding:10px;border-right:0;border-bottom:1px solid var(--line)}aside ul{display:flex;overflow:auto}aside li a{white-space:nowrap;padding:9px 11px}aside .side-intro{display:none}main,footer{margin-left:0;padding:25px 16px}.welcome{min-height:0;padding:28px}.welcome h1{font-size:35px}.coffee-art{display:none}.quick-grid{grid-template-columns:1fr}.table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><header>{{template "header"}}</header><aside>{{template "sidebar"}}</aside><main>{{template "content" .}}</main><footer>{{template "footer"}}</footer></body></html>{{end}}
