{{define "content"}}<div class="page-head clearfix"><h3 class="float-left">Data Cabang</h3></div>
<form class="form" method="post"><div class="form-group"><label>Kode</label><input class="form-control" name="kode" required></div><div class="form-group"><label>Nama Cabang</label><input class="form-control" name="nama" required></div><div class="form-group"><label>Alamat</label><input class="form-control" name="alamat" required></div><div class="form-group"><label>Telepon</label><input class="form-control" name="telepon"></div><button class="btn">Tambah Cabang</button></form>
<table class="table"><thead><tr><th>Kode</th><th>Nama</th><th>Alamat</th><th>Telepon</th><th>Status</th></tr></thead><tbody>{{range .}}<tr><td>{{.Kode}}</td><td>{{.Nama}}</td><td>{{.Alamat}}</td><td>{{.Telepon}}</td><td>{{if .Aktif}}Aktif{{else}}Nonaktif{{end}}</td></tr>{{end}}</tbody></table>{{end}}
