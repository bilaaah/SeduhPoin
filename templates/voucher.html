{{define "content"}}<div class="page-head clearfix"><h3 class="float-left">Voucher Berkode</h3></div><form class="form" method="post"><div class="form-group"><label>Promo</label><select class="form-control" name="promo_id" required><option value="">Pilih promo</option>{{range .Promo}}<option value="{{.ID}}">{{.Kode}} - {{.Nama}}</option>{{end}}</select></div><div class="form-group"><label>Kode Voucher</label><input class="form-control" name="kode" required></div><div class="form-group"><label>Kuota</label><input class="form-control" type="number" name="kuota" min="1" required></div><button class="btn">Tambah Voucher</button></form><table class="table"><thead><tr><th>Kode</th><th>Promo</th><th>Kuota</th><th>Terpakai</th></tr></thead><tbody>{{range .Voucher}}<tr><td>{{.Kode}}</td><td>{{.PromoNama}}</td><td>{{.Kuota}}</td><td>{{.Terpakai}}</td></tr>{{end}}</tbody></table>{{end}}
