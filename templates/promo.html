{{define "content"}}<div class="page-head clearfix"><h3 class="float-left">Pengaturan Promo</h3></div><form class="form" method="post"><div class="form-group"><label>Kode Promo</label><input class="form-control" name="kode" required></div><div class="form-group"><label>Nama Promo</label><input class="form-control" name="nama" required></div><div class="form-group"><label>Jenis</label><select class="form-control" name="jenis"><option value="PERSENTASE_PRODUK">Diskon persentase produk</option><option value="POTONGAN_MIN_BELANJA">Potongan minimal belanja</option><option value="BUY2_GET1">Beli 2 gratis 1</option><option value="VOUCHER">Voucher</option></select></div><div class="form-group"><label>Produk target (opsional)</label><select class="form-control" name="produk_id"><option value="0">Semua produk</option>{{range .Produk}}<option value="{{.ID}}">{{.Nama}}</option>{{end}}</select></div><div class="form-group"><label>Kategori target (opsional)</label><select class="form-control" name="kategori_id"><option value="0">Semua kategori</option>{{range .Kategori}}<option value="{{.ID}}">{{.Nama}}</option>{{end}}</select></div><div class="form-group"><label>Cabang (opsional)</label><select class="form-control" name="cabang_id"><option value="0">Semua cabang</option>{{range .Cabang}}<option value="{{.ID}}">{{.Nama}}</option>{{end}}</select></div><div class="form-group"><label>Nilai</label><input class="form-control" type="number" name="nilai" min="0"></div><div class="form-group"><label>Minimal belanja</label><input class="form-control" type="number" name="minimal" min="0"></div><div class="form-group"><label>Maksimal pemakaian (0 = tanpa batas)</label><input class="form-control" type="number" name="maksimal" min="0"></div><div class="form-group"><label>Mulai</label><input class="form-control" type="datetime-local" name="mulai" required></div><div class="form-group"><label>Berakhir</label><input class="form-control" type="datetime-local" name="berakhir" required></div><div class="form-group"><label>Jam mulai dan selesai (opsional)</label><input class="form-control" type="time" name="mulai_jam"><input class="form-control" type="time" name="berakhir_jam"></div><button class="btn">Tambah Promo</button></form><table class="table"><thead><tr><th>Kode</th><th>Nama</th><th>Jenis</th><th>Nilai</th><th>Periode</th><th>Pemakaian</th></tr></thead><tbody>{{range .Promo}}<tr><td>{{.Kode}}</td><td>{{.Nama}}</td><td>{{.Jenis}}</td><td>{{.Nilai}}</td><td>{{.Mulai.Format "02/01/2006 15:04"}} s.d. {{.Berakhir.Format "02/01/2006 15:04"}}</td><td>{{.Terpakai}} / {{if eq .Maksimal 0}}∞{{else}}{{.Maksimal}}{{end}}</td></tr>{{end}}</tbody></table>{{end}}
